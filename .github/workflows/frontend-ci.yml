name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "myApp/**"
  pull_request:
    branches: [main]
    paths:
      - "myApp/**"

jobs:
  build:
    if: github.repository == 'NguyenHoangFPT6203/A20-App-152-fork'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myApp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'NguyenHoangFPT6203/A20-App-152-fork' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
